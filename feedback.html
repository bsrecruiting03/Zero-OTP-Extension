<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We'll miss you! - Zero OTP Feedback</title>
    <!-- Modern Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-label: #64748b;
            --border: #e2e8f0;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            max-width: 480px;
            width: 100%;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        h1 {
            font-weight: 700;
            font-size: 1.5rem;
            margin: 0 0 8px 0;
            letter-spacing: -0.025em;
        }

        p {
            color: var(--text-label);
            font-size: 0.95rem;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .options-grid {
            display: grid;
            gap: 12px;
            margin-bottom: 24px;
        }

        .option-card {
            padding: 14px 18px;
            border: 2px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: left;
            background: none;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-main);
            position: relative;
        }

        .option-card:hover {
            border-color: var(--primary);
            background-color: #f5f3ff;
            color: var(--primary);
        }

        .option-card.selected {
            border-color: var(--primary);
            background-color: #f5f3ff;
            color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .option-card.selected::after {
            content: '✓';
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-weight: 700;
        }

        textarea {
            width: 100%;
            padding: 16px;
            border: 2px solid var(--border);
            border-radius: 12px;
            resize: none;
            height: 120px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 0.95rem;
            transition: border-color 0.2s;
            margin-top: 8px;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .submit-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            width: 100%;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 24px;
            box-shadow: 0 4px 6px -1px rgba(99, 102, 241, 0.4);
        }

        .submit-btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .footer {
            margin-top: 32px;
            font-size: 0.8rem;
            color: var(--text-label);
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="logo">🔓</div>
        <h1>We're sorry to see you go!</h1>
        <p>Your feedback helps us make Zero OTP better. Why did you decide to uninstall?</p>

        <!-- FORM TARGET -->
        <form action="https://formspree.io/f/xlgpgyrp" method="POST" id="feedbackForm">
            <div class="options-grid">
                <button type="button" class="option-card" onclick="setReason('Bug/Technical Issues', this)">Technical
                    issues or bugs</button>
                <button type="button" class="option-card" onclick="setReason('Security Concerns', this)">Security or
                    privacy concerns</button>
                <button type="button" class="option-card" onclick="setReason('Difficult to Use', this)">Too complicated
                    to set up</button>
                <button type="button" class="option-card" onclick="setReason('Found Alternative', this)">Found a better
                    alternative</button>
            </div>

            <input type="hidden" name="reason" id="reason_input" required>

            <label style="font-size: 0.85rem; font-weight: 600; color: var(--text-label);">ANYTHING ELSE WE SHOULD
                KNOW?</label>
            <textarea name="message" placeholder="Optional: Tell us more about your experience..."></textarea>

            <button type="submit" class="submit-btn">Send Feedback</button>
        </form>

        <div class="footer">
            &copy; 2024 Zero OTP Extension. All rights reserved.
        </div>
    </div>

    <script>
        function setReason(val, btn) {
            // Reset styles
            document.querySelectorAll('.option-card').forEach(card => card.classList.remove('selected'));
            // Set selected
            btn.classList.add('selected');
            // Set hidden input
            document.getElementById('reason_input').value = val;
        }

        document.getElementById('feedbackForm').onsubmit = function (e) {
            if (!document.getElementById('reason_input').value) {
                alert('Please select a reason first!');
                return false;
            }
        }
    </script>
</body>

</html>
